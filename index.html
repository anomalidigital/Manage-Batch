<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Batch CDK</title>
<style>
:root{
  --bg:#0f1115; --bg2:#161a21; --bg3:#1d222b; --line:#2a313d; --line2:#39424f;
  --tx:#e6e9ef; --tx2:#9aa4b2; --tx3:#6b7480;
  --ac:#4f8cff; --ac2:#1e3a5f;
  --p1:#ef4444; --p2:#f59e0b; --p3:#22c55e;
  --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
  --r:10px; --sh:0 8px 24px rgba(0,0,0,.35);
}
:root[data-tema="terang"]{
  --bg:#f6f7f9; --bg2:#ffffff; --bg3:#eef1f5; --line:#dde2e9; --line2:#c6cedb;
  --tx:#141821; --tx2:#5b6472; --tx3:#8a93a1; --ac:#2563eb; --ac2:#dbe6ff;
  --sh:0 8px 24px rgba(15,20,30,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ac)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- kerangka ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.merek{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.merek .kotak{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f8cff,#8b5cf6);
  display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
.tumbuh{flex:1}
.bar2{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--bg);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
/* Tombol aksi selalu di ujung kanan — juga ketika bar melipat ke baris baru,
   karena margin kiri otomatis mendorongnya ke tepi kanan barisnya sendiri. */
.bar2-aksi{display:flex;gap:8px;align-items:center;margin-left:auto;flex:none}
@media(max-width:640px){ .bar2-aksi{width:100%;justify-content:flex-end} }
.isi{flex:1;overflow:auto;padding:14px;scroll-behavior:smooth}
.sesi{margin-bottom:22px;scroll-margin-top:8px}
.sesi > h2{margin:0 0 10px;font-size:14px;letter-spacing:.3px;display:flex;align-items:center;gap:9px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.sesi > h2 .cap{font-size:11px;font-weight:500;color:var(--tx2);background:var(--bg3);
  border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.sesi > h2 .ket{font-size:11.5px;font-weight:400;color:var(--tx3);margin-left:auto;text-align:right}
.jalur-info{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-bottom:10px}
.jalur-info span{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.tile{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-bottom:12px}
.tile .t{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .t b{display:block;font-size:22px;line-height:1.2}
.tile .t span{font-size:11.5px;color:var(--tx2)}
.tile .t.klik{cursor:pointer}
.tile .t.klik:hover{border-color:var(--ac)}
/* ---------- penugasan orang ---------- */
.pic-sel{display:flex;align-items:center;gap:6px;min-width:0}
.pic-sel select{min-width:104px}
.pic-sel.kosong select{color:var(--ac);border:1px dashed var(--ac);background:var(--ac2);font-weight:600}
.baris-tugas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--bg2);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
td.cek,th.cek{width:34px;padding-left:14px}
/* ---------- daftar yang ditenangkan ---------- */
.tbl-rapi td{padding:10px 12px;vertical-align:middle}
.tbl-rapi tbody tr.brs:hover{background:var(--bg3)}
.tbl-rapi tr.pilih{background:var(--ac2)}
.tbl-rapi td.cek input{opacity:.25;cursor:pointer}
.tbl-rapi tr:hover td.cek input,.tbl-rapi td.cek input:checked{opacity:1}
/* kendali tanpa bingkai: baru terlihat sebagai kendali saat disentuh */
select.tlg{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid transparent;
  border-radius:7px;padding:3px 7px;cursor:pointer;max-width:100%;text-overflow:ellipsis}
select.tlg:hover{border-color:var(--line2);background:var(--bg3)}
select.tlg:focus{outline:none;border-color:var(--ac);background:var(--bg)}
select.tlg option{background:var(--bg2);color:var(--tx)}
.pri-P1{color:var(--p1);font-weight:800}
.pri-P2{color:var(--p2);font-weight:800}
.pri-P3{color:var(--p3);font-weight:800}
td.pri{width:78px;white-space:nowrap}
td.proj{width:210px}
td.proj .kd{font-weight:700;letter-spacing:.2px;cursor:pointer}
td.proj .kd:hover{color:var(--ac)}
td.proj .sub{font-size:11.5px;color:var(--tx3);margin-top:2px}
td.kerja{cursor:pointer}
td.kerja .rv{line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
td.kerja .bf{font-size:12px;color:var(--tx2);margin-top:3px;padding-left:9px;
  border-left:2px solid var(--ac);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
td.pic{width:168px}
td.st{width:190px;white-space:nowrap}
.stat{display:inline-flex;align-items:center;gap:6px;min-width:0}
.pic-sel.kosong select{color:var(--tx3);border:1px dashed var(--line2);background:transparent;font-weight:500}
.pic-sel.kosong:hover select{color:var(--ac);border-color:var(--ac)}
.api{color:var(--err)}
/* ---------- pemilih nomor slab ---------- */
.kisi-slab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;user-select:none;margin-top:8px}
.kisi-slab button{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 0;
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--tx2)}
.kisi-slab button:hover{border-color:var(--ac)}
.kisi-slab button.pilih{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.kisi-slab button.tepi{border-radius:6px}
.slab-alat{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.slab-alat .inp{width:78px;text-align:center}
.slab-hasil{font-weight:700;font-size:15px;letter-spacing:.3px}
/* ---------- isian tanggal ---------- */
.tgl-kotak{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tgl-kotak .inp{flex:1;min-width:120px}
.tgl-cepat{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tgl-cepat button{background:var(--bg3);border:1px solid var(--line);border-radius:20px;
  padding:3px 10px;font-size:11.5px;color:var(--tx2)}
.tgl-cepat button:hover{border-color:var(--ac);color:var(--tx)}
.tgl-baca{font-size:12px;color:var(--tx2);margin-top:4px;display:block}
.tgl-baca.salah{color:var(--err)}
/* ---------- tanda menyala + kelompok hari yang bisa ditutup ---------- */
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:1px 6px;
  border-radius:5px;color:#fff;vertical-align:middle;margin-left:6px}
.tbl-rapi tr.t-baru td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.tbl-rapi tr.t-ulang td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.tbl-rapi tr.t-kelar td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.tbl-rapi tr.t-kelar td.proj .kd{text-decoration:line-through;text-decoration-color:var(--tx3)}
.tgl-tutup{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:7px}
.tgl-tutup:hover{color:var(--tx)}
.tgl-tutup .kar{display:inline-block;width:11px;color:var(--tx3);font-size:10px}
tr.hari.tertutup td{opacity:.72}
.ringkas-hari{font-weight:400;text-transform:none;letter-spacing:0;color:var(--tx3);margin-left:10px}
.lbl-id{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.5px;padding:1px 4px;
  border-radius:4px;background:var(--line2);color:var(--tx);vertical-align:middle}
.terjemah{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2)}
.terjemah .teks-id{margin-top:4px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
.terjemah.kcl .teks-id{font-size:12px;color:var(--tx2)}
tr.hari td .cekhari{margin-right:8px}
#barAksi{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:45;
  background:var(--bg2);border:1px solid var(--ac);border-radius:12px;box-shadow:var(--sh);
  padding:9px 13px;display:none;align-items:center;gap:9px;flex-wrap:wrap;max-width:94vw}
#barAksi.on{display:flex}

/* ---------- kontrol ---------- */
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
  color:var(--tx);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--bg2)}
.btn.utama{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.utama:hover{filter:brightness(1.08)}
.btn.kecil{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.bahaya{color:var(--err);border-color:#4a2530}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp,select.inp,textarea.inp{background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;color:var(--tx);min-width:0;width:100%}
.inp:focus{outline:2px solid var(--ac2);border-color:var(--ac)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
select.inp{cursor:pointer}
.cari{position:relative;min-width:180px;flex:1;max-width:320px}
.cari .inp{padding-left:29px}
.cari::before{content:"⌕";position:absolute;left:9px;top:5px;color:var(--tx3);font-size:15px}
select.tipis{background:transparent;border-color:transparent;color:var(--tx2);padding:5px 7px}
select.tipis:hover{border-color:var(--line);background:var(--bg3)}
select.tipis:focus{color:var(--tx)}
.bar2 .pil{color:var(--tx2);border-color:transparent}
.bar2 .pil:hover{border-color:var(--line);background:var(--bg3)}
.tab{display:flex;gap:2px;background:var(--bg3);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab button{background:none;border:0;padding:5px 12px;border-radius:7px;color:var(--tx2);font-weight:600;font-size:13px}
.tab button.on{background:var(--bg2);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pil{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--bg3);white-space:nowrap}
.titik{width:8px;height:8px;border-radius:50%;flex:none}
.ava{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  font-weight:700;color:#fff;flex:none}
.ava.b{width:40px;height:40px;font-size:15px}
.samar{color:var(--tx2)}
.samar2{color:var(--tx3)}
.mini{font-size:12px}

/* ---------- indikator sinkron ---------- */
.sink{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:20px;
  border:1px solid var(--line);background:var(--bg3);white-space:nowrap}
.sink .titik{width:7px;height:7px}

/* ---------- papan ---------- */
.papan{display:flex;gap:11px;align-items:flex-start;min-height:100%}
.kol{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);width:275px;flex:none;
  display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.kol h3{margin:0;padding:10px 12px;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--tx2);display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.kol h3 .n{margin-left:auto;background:var(--bg3);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--tx2)}
.kol .isikol{padding:9px;display:flex;flex-direction:column;gap:9px;overflow:auto}
.kartu{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;
  transition:border-color .12s,transform .06s}
.kartu:hover{border-color:var(--ac)}
.kartu:active{transform:scale(.995)}
.kartu .kode{font-weight:700;font-size:13px;letter-spacing:.2px;word-break:break-all}
.kartu .rev{color:var(--tx2);font-size:12.5px;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kartu .kaki{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.aksi-b{width:100%;margin-top:9px;justify-content:center;font-size:12px}

/* ---------- tabel ---------- */
.bungkus-tabel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--bg2);text-align:left;padding:9px 10px;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
tr.hari td{background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--tx2);
  padding:9px 12px;position:sticky;top:33px;z-index:1}
tr.hari td .n{font-weight:500;color:var(--tx2);margin-left:7px}
td.kodesel{font-weight:650;white-space:nowrap;cursor:pointer}
td.kodesel:hover{color:var(--ac)}
.sel-inp{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 5px;width:100%}
.sel-inp:hover{border-color:var(--line)}
.sel-inp:focus{border-color:var(--ac);background:var(--bg)}

/* ---------- per orang ---------- */
.orang-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r);padding:14px}
.orang-stat{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:78px}
.stat b{display:block;font-size:19px;line-height:1.25}
.stat span{font-size:11px;color:var(--tx2)}
.grup{margin-top:14px}
.grup h4{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);
  display:flex;align-items:center;gap:8px}
.baris{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.baris:hover{border-color:var(--ac)}
.baris .kode{font-weight:650;white-space:nowrap}
.baris .rev{color:var(--tx2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:80px}
.kosong{color:var(--tx3);padding:16px;text-align:center;border:1px dashed var(--line);border-radius:9px}

/* ---------- ringkasan ---------- */
.kisi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kartu-b{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.kartu-b h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.bar{height:7px;border-radius:6px;background:var(--bg3);overflow:hidden;display:flex;margin:7px 0}
.bar i{display:block;height:100%}
.lst{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.lst div{display:flex;gap:8px;align-items:center}
.lst b{margin-left:auto}

/* ---------- laci detail ---------- */
.tirai{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.tirai.on{opacity:1;pointer-events:auto}
.laci{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--bg2);
  border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s;z-index:41;
  display:flex;flex-direction:column;box-shadow:var(--sh)}
.laci.on{transform:none}
.laci header{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.laci .badan{overflow:auto;padding:15px;flex:1}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);margin-bottom:4px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aksi-kotak{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:11px;margin-bottom:14px}
.aksi-kotak .jdl{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx2);margin-bottom:8px}
.aksi-kotak .tbl{display:flex;gap:7px;flex-wrap:wrap}
/* ---------- brief ---------- */
.brief-baru{border:1px solid var(--ac);border-left:4px solid var(--ac);background:var(--ac2);
  border-radius:10px;padding:11px 12px;margin-bottom:10px}
:root[data-tema="gelap"] .brief-baru{background:linear-gradient(180deg,rgba(79,140,255,.16),rgba(79,140,255,.06))}
.brief-baru .tag{display:inline-flex;align-items:center;gap:5px;background:var(--ac);color:#fff;
  font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:20px}
.brief-baru .isi-b{margin-top:7px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.brief-lama{border-left:3px solid var(--line2);background:var(--bg3);border-radius:0 8px 8px 0;
  padding:8px 11px;margin-bottom:6px}
.brief-lama .isi-b{font-size:12.5px;color:var(--tx2);white-space:pre-wrap;word-break:break-word;margin-top:3px}
.brief-lama.coret .isi-b{text-decoration:line-through;opacity:.6}
.kartu .brief-mini{margin-top:7px;border-left:3px solid var(--ac);background:var(--ac2);border-radius:0 7px 7px 0;
  padding:5px 8px;font-size:12px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
:root[data-tema="gelap"] .kartu .brief-mini{background:rgba(79,140,255,.12)}
.ronde{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:9px;background:var(--bg3)}
.ronde .kep{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ronde .kep b{font-size:12.5px}
.riw{font-size:12px;color:var(--tx2);border-left:2px solid var(--line2);padding:3px 0 3px 10px;margin-bottom:2px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);z-index:50;padding:16px}
.modal.on{display:grid}
.modal .kotak-m{background:var(--bg2);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);
  max-height:88vh;overflow:auto;box-shadow:var(--sh)}
/* varian panel kanan: dipakai "Project baru" supaya sejajar dengan panel detail */
.modal.samping{padding:0;place-items:stretch;justify-items:end}
.modal.samping .kotak-m{width:min(560px,100vw);max-height:100vh;height:100vh;border-radius:0;
  border:0;border-left:1px solid var(--line);display:flex;flex-direction:column;
  animation:geserMasuk .18s ease-out}
.modal.samping .badan-m{flex:1;overflow:auto}
.modal.samping header{flex:none}
.modal.samping footer{flex:none}
@keyframes geserMasuk{from{transform:translateX(100%)}to{transform:none}}
.modal header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:9px}
.modal .badan-m{padding:16px}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.info{background:var(--ac2);border:1px solid var(--ac);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.peringatan{background:#3a2a12;border:1px solid #7c5a1d;color:#f6d59a;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
:root[data-tema="terang"] .peringatan{background:#fff5e0;border-color:#e8c47a;color:#7a5510}
.pesan{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:9px 16px;z-index:60;
  transition:.18s;box-shadow:var(--sh);pointer-events:none;max-width:90vw}
.pesan.on{opacity:1;transform:translateX(-50%)}
@media(max-width:640px){
  .isi{padding:10px}
  .kol{width:86vw}
  .duo{grid-template-columns:1fr}
}

</div>

var STOP_EN = ['the','please','could','you','we','and','with','to','is','are','this','that','of','for','can','it','a','an','we','your'];
/* Teks ini kelihatannya Inggris? (dipakai supaya brief yang sudah Indonesia
   tidak ikut diacak-acak) */
function sepertiInggris(teks){
  var kata = String(teks||'').toLowerCase().match(/[a-z']+/g) || [];
  if(kata.length < 2) return false;
  var tahu = kata.filter(function(w){
    return KAMUS_KATA[w] !== undefined || STOP_EN.indexOf(w) >= 0;
  }).length;
  return (tahu / kata.length) >= 0.5;
}
function terjemahOtomatis(teks){
  var t = ' ' + String(teks||'') + ' ';
  KAMUS_FRASA.forEach(function(pas){
    t = t.replace(new RegExp('\\b' + pas[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi'), pas[1]);
  });
  t = t.replace(/\b[A-Za-z']+\b/g, function(w){
    if(w.length > 3 && w === w.toUpperCase()) return w;       // kode batu / NAMA TYPE
    var g = KAMUS_KATA[w.toLowerCase()];
    if(g === undefined) return w;
    if(g && w[0] === w[0].toUpperCase() && w.length > 1) return g.charAt(0).toUpperCase() + g.slice(1);
    return g;
  });
  t = t.replace(/[ \t]+/g, ' ').replace(/ +([,.?!:;])/g, '$1').replace(/\n /g, '\n').trim();
  // huruf besar di awal kalimat (juga sesudah . ? ! dan ganti baris)
  t = t.replace(/(^|[.?!]\s+|\n\s*)([a-z])/g, function(_, aw, hr){ return aw + hr.toUpperCase(); });
  return t;
}

/* Baris Supabase -> objek aplikasi, dan sebaliknya. Isinya disimpan apa
   adanya di kolom JSON, jadi kolom baru tidak perlu ubah tabel. */
function dariBarisSB(baris){
  return (baris||[]).map(function(r){
    var o = r.data || {};
    if(!o.id) o.id = r.id;
    if(r.diperbarui && !o.diperbarui) o.diperbarui = r.diperbarui;
    return o;
  });
}
function keBarisSB(daftar){
  return (daftar||[]).map(function(o){
    return {id:o.id, data:o, diperbarui:o.diperbarui || new Date().toISOString()};
  });
}
/* Yang perlu dikirim: baris yang berbeda dari versi terakhir yang tersimpan. */
function bedaKirim(basisDaftar, daftar){
  var b = {};
  (basisDaftar||[]).forEach(function(x){ b[x.id] = JSON.stringify(x); });
  return (daftar||[]).filter(function(x){ return b[x.id] !== JSON.stringify(x); });
}
function buangYangDihapus(daftar){
  return (daftar||[]).filter(function(x){ return !x.dihapus; });
}
function briefTampil(b, mauID){
  if(!b) return null;
  if(b.terjemahan) return {teks:b.terjemahan, asli:b.teks, jenis:'tangan'};
  if(mauID && sepertiInggris(b.teks)) return {teks:terjemahOtomatis(b.teks), asli:b.teks, jenis:'otomatis'};
  return {teks:b.teks, asli:b.teks, jenis:'asli'};
}

/* Tanda menyala di daftar: BARU (baru masuk), REVISI KE-N (dibuka lagi karena
   klien minta revisi setelah selesai), BARU SELESAI (baru saja kelar). */
function tandaBaris(p, ini){
  var t = [];
  if(p.urgent && !sudahFinal(p)) t.push({teks:'URGENT', warna:'var(--err)'});
  if(p.dibuka_ulang && !sudahFinal(p)) t.push({teks:'REVISI KE-' + p.dibuka_ulang, warna:'var(--warn)'});
  var hb = hariAntara(p.diterima, ini);
  if(p.status === 'antrean' && !p.dibuka_ulang && hb !== null && hb >= 0 && hb <= 1) t.push({teks:'BARU', warna:'var(--ac)'});
  var hs = hariAntara(p.selesai_pada, ini);
  if(sudahFinal(p) && hs !== null && hs >= 0 && hs <= 2) t.push({teks:'BARU SELESAI', warna:'var(--ok)'});
  return t;
}
/* Sudah lewat tenggat? >0 = telat sekian hari, <=0 = masih ada waktu, null = tanpa tenggat */
function telatHari(p, ini){
  if(!p || !p.tenggat || sudahFinal(p)) return null;
  return hariAntara(p.tenggat, ini);
}

function hariAntara(dari, ke){
  if(!dari) return null;
  var a = new Date(dari+'T00:00:00'), b = new Date((ke||'')+'T00:00:00');
  if(isNaN(a) || isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}
/* ---------- Nomor slab: "36, 37, ... 50" <-> "36–50" ----------
   Operator memilih dengan menarik angka di kisi; yang disimpan tetap teks
   ringkas supaya sama dengan kebiasaan menulis di catatan. */
function ringkasNomor(arr){
  var a = (arr || []).map(Number).filter(function(x){ return !isNaN(x); })
            .sort(function(x, y){ return x - y; });
  a = a.filter(function(x, i){ return i === 0 || x !== a[i-1]; });
  var out = [], i = 0;
  while(i < a.length){
    var j = i;
    while(j + 1 < a.length && a[j+1] === a[j] + 1) j++;
    out.push(j > i ? (a[i] + '–' + a[j]) : String(a[i]));
    i = j + 1;
  }
  return out.join(', ');
}
function uraiNomor(teks){
  var out = [];
  String(teks || '').split(/[,;]+/).forEach(function(bag){
    var b = bag.trim(); if(!b) return;
    var m = b.match(/^(\d+)\s*[–\-—]\s*(\d+)$/);
    if(m){
      var a1 = +m[1], a2 = +m[2];
      if(a1 > a2){ var t = a1; a1 = a2; a2 = t; }
      for(var k = a1; k <= a2 && k - a1 < 500; k++) out.push(k);
      return;
    }
    var n = b.match(/\d+/);
    if(n) out.push(+n[0]);
  });
  return out.filter(function(x, i, arr){ return arr.indexOf(x) === i; })
            .sort(function(a, b){ return a - b; });
}

/* ---------- Tanggal boleh ditulis bebas ----------
   Menerima: "7 sep", "7 september", "7/9", "7-9-26", "260907" (persis format
   nama folder di server), "2026-09-07", angka polos "7" (bulan berjalan),
   serta "hari ini" / "kemarin" / "besok". */
var BULAN_PENDEK = {jan:1, feb:2, mar:3, apr:4, mei:5, may:5, jun:6, jul:7,
                    agu:8, aug:8, sep:9, okt:10, oct:10, nov:11, des:12, dec:12};
function _tgl(th, bl, hr){
  th = +th; bl = +bl; hr = +hr;
  if(!(th >= 2000 && th <= 2099) || !(bl >= 1 && bl <= 12) || !(hr >= 1 && hr <= 31)) return '';
  var d = new Date(th, bl - 1, hr);
  if(d.getFullYear() !== th || d.getMonth() !== bl - 1 || d.getDate() !== hr) return '';
  return th + '-' + String(bl).padStart(2, '0') + '-' + String(hr).padStart(2, '0');
}
function parseTanggalBebas(teks, ini){
  var t = String(teks || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if(!t) return '';
  if(!ini || !/^\d{4}-\d{2}-\d{2}$/.test(ini)) return '';
  var thnIni = +ini.slice(0, 4), blnIni = +ini.slice(5, 7), m;
  if(t === 'hari ini' || t === 'today') return ini;
  if(t === 'kemarin') return tambahHari(ini, -1);
  if(t === 'besok') return tambahHari(ini, 1);
  if((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return _tgl(m[1], m[2], m[3]);
  if((m = t.match(/^(\d{2})(\d{2})(\d{2})$/))) return _tgl('20' + m[1], m[2], m[3]);
  if((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/))){
    var th = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : thnIni;
    return _tgl(th, m[2], m[1]);
  }
  if((m = t.match(/^(\d{1,2}) ?([a-z]{3,9})\.? ?(\d{2,4})?$/))){
    var b = BULAN_PENDEK[m[2].slice(0, 3)];
    if(b){
      var th2 = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : thnIni;
      return _tgl(th2, b, m[1]);
    }
  }
  if((m = t.match(/^(\d{1,2})$/))) return _tgl(thnIni, blnIni, m[1]);
  return '';
}

/* ---------- Nama folder di server = sumber data tercepat ----------
   Pola yang dipakai tim: YYMMDD_KODE_JUMLAHSLAB_keterangan, misalnya
   "260907_SOLBLA20H6004_39_keep the colour of the raw images".
   Dari satu baris itu bisa langsung terisi tanggal, kode, dan jumlah slab. */
function uraiNamaFolder(teks, ini){
  var t = String(teks || '').trim().replace(/^[\\\/]+|[\\\/]+$/g, '');
  var hasil = {tanggal:'', kode:'', jumlah:null, keterangan:''};
  if(!t) return hasil;
  var sisa = t, m = t.match(/^(\d{6})[_\s.\-]+(.*)$/);
  if(m){
    var tgl = parseTanggalBebas(m[1], ini);
    if(tgl){ hasil.tanggal = tgl; sisa = m[2]; }
  }
  var bag = sisa.split(/_+/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(!bag.length) return hasil;
  hasil.kode = bag[0].replace(/\s+/g, '');
  if(bag.length > 1 && /^\d+$/.test(bag[1])){ hasil.jumlah = +bag[1]; bag.splice(1, 1); }
  hasil.keterangan = bag.slice(1).join(' ').trim();
  return hasil;
}

/* Apa langkah berikutnya untuk project ini? Ditentukan status (empat) dan
   keterangan rinci di dalamnya.
   opsi.reviewer = true bila yang membuka aplikasi berhak menyetujui hasil. */
function aksiBerikutnya(p, opsi){
  opsi = opsi || {};

  if(st === 'final') return [
    {kode:'revisi_baru', label:'Catat permintaan revisi baru', utama:true},

  ];
  if(rc === 'ditunda') return [{kode:'lanjut', label:'Lanjutkan pengerjaan', utama:true}];
  if(rc === 'review'){
    if(opsi.reviewer) return [
      {kode:'setuju', label:'Setujui & selesaikan', utama:true},
      {kode:'tolak',  label:'Kembalikan untuk perbaikan'}
    ];
    return [{kode:'', label:'Menunggu persetujuan ' + ((opsi.reviewer_nama||[]).join(' / ') || 'atasan'), mati:true}];
  }
  if(st === 'antrean'){
    if(jl === 'belum') return [
      {kode:'jalur_langsung', label:'Kerjakan langsung (tanpa sample)', utama:true},
      {kode:'jalur_sample',   label:'Perlu sample untuk klien', utama:true}
    ];
    return jl === 'sample'
      ? [{kode:'mulai_sample', label:'Mulai siapkan sample', utama:true}]
      : [{kode:'mulai', label:'Mulai kerjakan', utama:true}];
  }
  if(st === 'revisi'){
    if(rc === 'perbaikan') return [{kode:'perbaiki', label:'Lanjutkan perbaikan', utama:true}];
    var n = (p.sampel||[]).length + 1;
    return [{kode:'sample_baru', label:'Siapkan sample ronde ' + n, utama:true}];
  }
  if(rc === 'sample_buat')  return [{kode:'kirim_sample', label:'Kirim sample ke klien', utama:true}];
  if(rc === 'sample_kirim') return [{kode:'jawaban', label:'Catat tanggapan klien', utama:true}];
  if(rc === 'disetujui')    return [{kode:'apply', label:'Terapkan warna ke seluruh slab', utama:true}];
  if(rc === 'apply')        return [{kode:'ke_review', label:'Ajukan untuk persetujuan', utama:true}];
  return [{kode:'ke_review', label:'Ajukan untuk persetujuan', utama:true}];
}
/* Terapkan satu aksi. Mengembalikan project BARU + baris riwayat. Tidak mengubah masukan. */
function terapkanAksi(pAsli, kode, ctx){
  ctx = ctx || {}; var oleh = ctx.oleh || '—', tgl = ctx.tanggal || '', d = ctx.data || {};
  var p = JSON.parse(JSON.stringify(pAsli));
  p.sampel = p.sampel || []; p.riwayat = p.riwayat || [];
  var catat = '';
  function set(st, rc){ p.status = st; p.rinci = rc || ''; }
  var catat = '';
  function ronde(){
    p.sampel.push({ronde:p.sampel.length+1, dibuat:tgl, oleh:oleh, tautan:d.tautan||'',
      dikirim:'', jawaban:'menunggu', tanggal_jawaban:'', brief:'', lampiran:''});
  }
  switch(kode){
    case 'jalur_langsung': p.jalur='langsung'; set('proses',''); catat='jalur: tanpa sample, mulai dikerjakan'; break;
    case 'jalur_sample':   p.jalur='sample'; set('proses','sample_buat'); ronde(); catat='jalur: pakai sample, mulai sample ronde 1'; break;
    case 'mulai':          set('proses',''); catat='mulai dikerjakan'; break;
    case 'mulai_sample':   set('proses','sample_buat'); if(!p.sampel.length) ronde(); catat='mulai menyiapkan sample ronde '+p.sampel.length; break;
    case 'sample_baru':    set('proses','sample_buat'); ronde(); catat='menyiapkan sample ronde '+p.sampel.length; break;
    case 'kirim_sample': {
      set('proses','sample_kirim');
      var r = p.sampel.length ? p.sampel[p.sampel.length-1] : null;
      if(!r){ ronde(); r = p.sampel[p.sampel.length-1]; }
      r.dikirim = tgl; r.jawaban='menunggu'; if(d.tautan) r.tautan = d.tautan;
      catat = 'sample ronde '+r.ronde+' dikirim ke klien'; break;
    }
    case 'jawaban': {
      var r2 = p.sampel.length ? p.sampel[p.sampel.length-1] : null;
      if(!r2){ ronde(); r2 = p.sampel[p.sampel.length-1]; r2.dikirim = tgl; }
      r2.tanggal_jawaban = tgl; r2.brief = d.brief || ''; r2.lampiran = d.lampiran || '';
      if(d.hasil === 'final'){ r2.jawaban='final'; set('proses','disetujui'); catat='klien SETUJU (ronde '+r2.ronde+')'; }
      else { r2.jawaban='revisi'; set('revisi',''); catat='klien minta REVISI (ronde '+r2.ronde+')' + (d.brief? ': '+d.brief : ''); }
      if(d.brief) tambahBriefKe(p, {waktu:(ctx.stempel||tgl), oleh:'Klien', sumber:(d.hasil==='final'?'klien-final':'klien'),
        teks:d.brief, lampiran:d.lampiran||'', ronde:r2.ronde});
      break;
    }
    case 'apply':     set('proses','apply'); catat='menerapkan warna final ke seluruh slab'; break;
    case 'ke_review': set('proses','review'); p.diajukan_pada=tgl; p.diajukan_oleh=oleh;
                      catat='diajukan untuk persetujuan'; break;
    case 'setuju':    set('final',''); p.selesai_pada=tgl; p.direview_oleh=oleh;
                      catat='disetujui '+oleh+' → FINAL'; break;
    case 'tolak':     set('revisi','perbaikan'); p.direview_oleh=oleh;
                      catat='dikembalikan untuk perbaikan' + (d.catatan? ' — '+d.catatan : '');
                      if(d.catatan) tambahBriefKe(p, {waktu:(ctx.stempel||tgl), oleh:oleh, sumber:'review',
                        teks:d.catatan, lampiran:'', ronde:0});
                      break;
    case 'perbaiki':  set('proses',''); catat='mulai perbaikan dari catatan review'; break;
    case 'ke_edited': set('proses','review'); catat='diajukan untuk persetujuan'; break;
    case 'selesai':   set('final',''); p.selesai_pada=tgl; catat='ditandai FINAL'; break;
    case 'buka':      set('antrean',''); p.selesai_pada=''; catat='dibuka lagi'; break;
    case 'revisi_baru': {
      p.dibuka_ulang = (p.dibuka_ulang || 0) + 1;
      p.selesai_pada = '';
      if(p.jalur === 'sample') set('revisi',''); else set('antrean','');
      if(d.teks) tambahBriefKe(p, {waktu:(ctx.stempel||tgl), oleh:(d.oleh||'Klien'), sumber:'klien',
        teks:d.teks, lampiran:d.lampiran||'', ronde:(p.sampel||[]).length});
      catat = 'DIBUKA LAGI — revisi ke-' + p.dibuka_ulang + (d.teks ? ': ' + d.teks : '');
      break;
    }
    case 'tahan':     set('antrean','ditunda'); catat='ditunda'; break;
    case 'lanjut':    set('proses',''); catat='dilanjutkan lagi'; break;
    case 'brief':     tambahBriefKe(p, {waktu:(ctx.stempel||tgl), oleh:(d.oleh||oleh), sumber:(d.sumber||'internal'),
                        teks:d.teks||'', lampiran:d.lampiran||'', ronde:(p.sampel||[]).length});
                      catat='brief baru dicatat' + (d.sumber==='klien'?' (dari klien)':''); break;
    case 'urgent':    p.urgent = !p.urgent; catat = p.urgent ? 'ditandai URGENT' : 'tanda urgent dilepas'; break;
    default: return {p:pAsli, catat:''};
  }
  p.riwayat.push({waktu:(ctx.stempel||tgl), oleh:oleh, teks:catat});
  p.diperbarui = ctx.stempel || new Date().toISOString();
  return {p:p, catat:catat};
}
/* Gabung dua versi database tanpa server: per-item, yang paling baru menang;
   penghapusan dihormati bila item itu ada di basis (versi yang tadi dimuat). */
function gabungKoleksi(basis, lokal, remote){
  function idx(a){ var o={}; (a||[]).forEach(function(x){ o[x.id]=x; }); return o; }
  var B=idx(basis), L=idx(lokal), R=idx(remote), hasil=[], lihat={};
  function waktu(x){ return (x && x.diperbarui) || ''; }
  Object.keys(L).concat(Object.keys(R)).forEach(function(id){
    if(lihat[id]) return; lihat[id]=1;
    var l=L[id], r=R[id], b=B[id];
    if(l && r){
      var menang = waktu(l) >= waktu(r) ? l : r;
      var kalah  = menang === l ? r : l;
      if(menang.riwayat || kalah.riwayat){
        var kunci={}, gab=[];
        (menang.riwayat||[]).concat(kalah.riwayat||[]).forEach(function(e){
          var k=(e.waktu||'')+'|'+(e.oleh||'')+'|'+(e.teks||'');
          if(!kunci[k]){ kunci[k]=1; gab.push(e); }
        });
        gab.sort(function(a,b2){ return (a.waktu||'') < (b2.waktu||'') ? -1 : 1; });
        menang = Object.assign({}, menang, {riwayat:gab});
      }
      hasil.push(menang);
    } else if(l && !r){ if(!b) hasil.push(l); }
    else if(!l && r){ if(!b) hasil.push(r); }
  });
  return hasil;
}
function gabungDB(basis, lokal, remote){
  basis = basis || {};
  return {
    versi: 1,
    diperbarui: new Date().toISOString(),
    batches:  gabungKoleksi(basis.batches, lokal.batches, remote.batches),
    tim:      gabungKoleksi(basis.tim, lokal.tim, remote.tim),
    projects: gabungKoleksi(basis.projects, lokal.projects, remote.projects)
  };
}
var BULAN_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function tanggalIndo(iso){

  var b = String(iso).split('-');
  if(b.length !== 3) return String(iso);
  return parseInt(b[2],10) + ' ' + (BULAN_ID[parseInt(b[1],10)-1] || b[1]) + ' ' + b[0];

/* Kelompokkan per hari diterima, hari terbaru di atas — persis seperti
   "List pending slab: 10 sep / 9 sep / 7 sep" milik operator. */
function kelompokPerHari(projects){
  var peta = {};
  (projects||[]).forEach(function(p){
    var k = p.diterima || '';

function urutProject(a, b){

  var ta = a.tenggat || '', tb = b.tenggat || '';
  if(ta && tb && ta !== tb) return ta < tb ? -1 : 1;           // tenggat terdekat dulu
  if(ta && !tb) return -1;
  if(!ta && tb) return 1;
  var pa = a.prioritas || 'P3', pb = b.prioritas || 'P3';
  if(pa !== pb) return pa < pb ? -1 : 1;
  var da = a.diterima || '9999', db = b.diterima || '9999';
  if(da !== db) return da < db ? -1 : 1;
  return (a.kode||'') < (b.kode||'') ? -1 : 1;

/* Tempel dari tabel (Notion/Excel): pisah tab, minimal Kode; urutan kolom bebas ditebak. */
function parseTempel(teks, ini){
  var baris = String(teks||'').split(/\r?\n/).filter(function(b){ return b.trim(); });
  var out = [];
  baris.forEach(function(b){
    // baris bergaya nama folder server -> langsung terbaca lengkap
    if(/^\s*\d{6}[_\s.\-]/.test(b)){
      var f = uraiNamaFolder(b, ini);
      if(f.kode){
        out.push({prioritas:'', kode:f.kode, slab:'', revisi:f.keterangan,
                  jenis:[], pic:'', diterima:f.tanggal, jumlah:f.jumlah});
        return;
      }
    }
    var s = b.split('\t').map(function(x){ return x.trim(); });
    if(s.length < 2) s = b.split(/\s{2,}/).map(function(x){ return x.trim(); });
    var o = {prioritas:'', kode:'', slab:'', revisi:'', jenis:[], pic:'', diterima:''};
    s.forEach(function(sel){
      if(!sel || sel === '—' || sel === '-') return;
      if(!o.prioritas && /^P[123]$/i.test(sel)){ o.prioritas = sel.toUpperCase(); return; }
      if(!o.kode && /^[A-Z]{4,}[0-9A-Z]{4,}$/.test(sel.replace(/\s/g,''))){ o.kode = sel.replace(/\s/g,''); return; }
      if(!o.slab && /^[0-9]+([–\-—][0-9]+)?$/.test(sel)){ o.slab = sel; return; }
      if(!o.revisi){ o.revisi = sel; return; }
      if(!o.jenis.length){ o.jenis = sel.split(/[+,/]/).map(function(x){ return x.trim(); }).filter(Boolean); return; }
      if(!o.pic){ o.pic = sel; return; }
      if(!o.diterima){ o.diterima = sel; return; }
    });
    if(o.kode) out.push(o);
  });
  return out;
}
function ringkasOrang(projects, nama){
  var r = {total:0, aktif:0, tunggu:0, revisi:0, selesai:0, belum:0, review:0, urgent:0};
  (projects||[]).forEach(function(p){
    if((p.pic||'') !== nama) return;
    r.total++;
    if(p.urgent && !sudahFinal(p)) r.urgent++;
    if(sudahFinal(p)) r.selesai++;
    else if(menungguKlien(p)) { r.tunggu++; r.aktif++; }
    else if(p.status === 'revisi') { r.revisi++; r.aktif++; }
    else if(menungguPersetujuan(p)) { r.review++; r.aktif++; }
    else if(p.status === 'antrean') { r.belum++; }
    else r.aktif++;
  });

}

      if(coba === 2){
        setSink('galat','gagal kirim — dicoba lagi');
        clearTimeout(jamSimpan); jamSimpan = setTimeout(function(){ simpanKeGitHub(true); }, 20000);
        if(!otomatis) pesan('Gagal simpan: ' + e.message, 5000);
        return false;
      }
    }
  }
  setSink('galat','gagal simpan (bentrok berulang)');
  return false;
}
/* Tidak ada tombol Simpan: tiap perubahan langsung dikirim (jeda 1,2 detik

   anggota tim lain paling lama 15 detik kemudian. */
function simpanNanti(){
  clearTimeout(jamSimpan);
  jamSimpan = setTimeout(function(){ simpanData(true); }, 1200);
}
var sudahIngatToken = false;
function tandaiKotor(){
  kotor = true; LS.taruh('mb_cache', db);
  if(pakaiSB() || token){ setSink('muat','menyimpan…'); simpanNanti(); }
  else {
    setSink('kotor','tersimpan di browser ini saja');

      sudahIngatToken = true;

/* ============================ UBAH DATA ============================ */
function ubahProject(id, tambalan, catat){
  var p = pilihProject(id); if(!p) return;
  Object.assign(p, tambalan);
  p.diperbarui = new Date().toISOString();
  if(catat){ p.riwayat = p.riwayat || []; p.riwayat.push({waktu:new Date().toISOString(), oleh:saya||'—', teks:catat}); }
  tandaiKotor(); render();
}
function jalankanAksi(id, kode, data){
  var p = pilihProject(id); if(!p) return;
  var hasil = terapkanAksi(p, kode, {oleh:saya||'—', tanggal:hariIni(), stempel:new Date().toISOString(), data:data||{}});
  var i = db.projects.indexOf(p);
  db.projects[i] = hasil.p;
  tandaiKotor(); render(); if(hasil.catat) pesan(p.kode + ': ' + hasil.catat);
}

/* ============================ SARING ============================ */
function terpakai(){
  var q = ($('#cari').value || '').toLowerCase().trim();
  var fp = $('#fPic').value, fpr = $('#fPri').value, fs = $('#fStatus').value;
  var fb = $('#pilihBatch').value, tampilSelesai = $('#fSelesai').checked;
  var hanyaUrgent = $('#fUrgent').checked, hanyaSaya = $('#fSaya').checked;
  return (db.projects||[]).filter(function(p){
    if(p.dihapus) return false;
    if(fb && (p.batch||'') !== fb) return false;
    if(hanyaUrgent && !p.urgent) return false;
    if(hanyaSaya && saya && p.pic !== saya) return false;
    if(fp === '__kosong'){ if(p.pic) return false; } else if(fp && p.pic !== fp) return false;
    if(fpr && p.prioritas !== fpr) return false;
    if(fs && p.status !== fs) return false;
    if(!tampilSelesai && SELESAI.indexOf(p.status) >= 0 && fs !== 'final') return false;
    if(q){
      var teks = [p.kode, p.revisi, p.slab, p.catatan, (p.jenis||[]).join(' '), p.pic].join(' ').toLowerCase();
      if(teks.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(urutProject);
}

  var urgen = ps.filter(function(p){ return p.urgent && !sudahFinal(p); });

    + ((urgen.length||telat.length) ? '<div class="lst">'
        + urgen.map(function(p){ return '<div><span class="titik" style="background:var(--err)"></span>'
            + '<a href="#" data-buka="'+esc(p.id)+'">'+esc(p.kode)+'</a><span class="samar2 mini">'+esc(p.pic||'tanpa PIC')+'</span>'
            + '<b style="color:var(--err)">URGENT</b></div>'; }).join('')
        + telat.filter(function(p){ return !p.urgent; }).map(function(p){

            + '<b style="color:var(--warn)">telat '+telatHari(p, hariIni())+'h</b></div>'; }).join('')
        + '</div>'
      : '<div class="samar2 mini">aman, tidak ada yang urgent atau telat</div>') + '</div>';

  html += '<div class="kartu-b"><h4>⚠ Belum di-assign</h4>'
    + (tanpaPic.length ? '<div class="lst">' + tanpaPic.map(function(p){
        return '<div><span class="titik" style="background:'+(PRIORITAS[p.prioritas]||'')+'"></span>'

  html += '<div class="kartu-b"><h4>⏱ Menunggu tanggapan klien</h4>'
    + (tunggu.length ? '<div class="lst">' + tunggu.map(function(x){
        return '<div><a href="#" data-buka="'+esc(x.p.id)+'">'+esc(x.p.kode)+'</a>'
          + '<span class="samar2 mini">'+esc(x.p.pic||'tanpa PIC')+'</span>'
          + '<b style="color:'+((x.n||0)>=3?'var(--err)':'var(--warn)')+'">'+(x.n===null?'—':x.n+' hari')+'</b></div>'; }).join('') + '</div>'

/* Binding untuk kendali yang dibuat ulang tiap render */
function pasangBinding(){
  var so = $('#pilihOrang');
  if(so) so.onchange = function(){ orangPilih = so.value; LS.taruh('mb_orang', orangPilih); render(); };
  var bo = $('#btnOrangBaru');
  if(bo) bo.onclick = dialogOrang;
  var bt = $('#btnTugasSemua');
  if(bt) bt.onclick = function(){
    var n = $('#tugasSemua').value;
    if(!n){ pesan('Pilih dulu orangnya di sebelah kiri tombol'); return; }
    var ps = terpakai();
    if(!ps.length){ pesan('Tidak ada project yang tampil'); return; }
    if(!confirm('Assign ' + ps.length + ' project yang sedang tampil ke ' + n + '?')) return;
    ps.forEach(function(p){ if(p.pic !== n) ubahDiam(p.id, {pic:n}, 'Assigned → ' + n + ' (assign massal)'); });
    tandaiKotor(); render(); pesan(ps.length + ' project di-assign ke ' + n);
  };
  perbaruiBar();
}
/* Ubah tanpa render (dipakai tugas massal supaya tidak menggambar berkali-kali) */
function ubahDiam(id, tambalan, catat){
  var p = pilihProject(id); if(!p) return;
  Object.assign(p, tambalan);
  p.diperbarui = new Date().toISOString();
  if(catat){ p.riwayat = p.riwayat || []; p.riwayat.push({waktu:new Date().toISOString(), oleh:saya||'—', teks:catat}); }
}
function perbaruiBar(){
  var ids = Object.keys(terpilih).filter(function(k){ return terpilih[k]; });
  var bar = $('#barAksi');
  bar.classList.toggle('on', ids.length > 0);
  $('#barJml').textContent = ids.length + ' dipilih';
  var sel = $('#barPic');
  if(sel.dataset.isi !== String((db.tim||[]).length)){
    sel.innerHTML = '<option value="">— pilih orang —</option>'
      + (db.tim||[]).map(function(a){ return '<option>'+esc(a.nama)+'</option>'; }).join('');

  }
}

/* ================= KISI NOMOR SLAB (ditarik, bukan diketik) =================
   awalan = awalan id supaya bisa dipakai di dua tempat sekaligus (dialog
   project baru dan laci detail) tanpa bentrok. */
function blokSlab(awalan, nilai){
  var n = uraiNomor(nilai);
  var maks = 60;
  n.forEach(function(x){ if(x > maks) maks = Math.ceil(x / 12) * 12; });
  var h = '<div class="slab-alat">'
    + '<span class="samar2 mini">tekan angka awal lalu tarik ke angka akhir</span>'
    + '<div class="tumbuh" style="flex:1"></div>'
    + '<input class="inp" type="number" min="1" id="' + awalan + 'SlabDari" placeholder="dari">'
    + '<span class="samar">–</span>'
    + '<input class="inp" type="number" min="1" id="' + awalan + 'SlabSampai" placeholder="sampai">'
    + '<button class="btn kecil" type="button" id="' + awalan + 'SlabTerap">Pakai</button>'
    + '<button class="btn kecil" type="button" id="' + awalan + 'SlabKosong">Kosongkan</button>'
    + '</div>'
    + '<div class="kisi-slab" id="' + awalan + 'SlabKisi" style="touch-action:none">';
  for(var i = 1; i <= maks; i++)
    h += '<button type="button" data-n="' + i + '"' + (n.indexOf(i) >= 0 ? ' class="pilih"' : '') + '>' + i + '</button>';
  h += '</div>'
    + '<div style="margin-top:6px;display:flex;align-items:center;gap:9px">'
    + '<button class="btn kecil" type="button" id="' + awalan + 'SlabLagi">+ 24 angka</button>'
    + '<span class="slab-hasil" id="' + awalan + 'SlabHasil">' + (ringkasNomor(n) || '—') + '</span>'
    + '<span class="samar2 mini" id="' + awalan + 'SlabJml">' + (n.length ? n.length + ' slab' : 'belum dipilih') + '</span>'
    + '</div>';
  return h;
}
/* Sorot kisi mengikuti teks yang diketik operator ("36-50, 70"). */
function sorotSlab(awalan, teks){
  var kisi = $('#' + awalan + 'SlabKisi');
  if(!kisi) return;
  var n = uraiNomor(teks);
  Array.prototype.forEach.call(kisi.children, function(el){
    el.classList.toggle('pilih', n.indexOf(+el.dataset.n) >= 0);
  });
  var hasil = $('#' + awalan + 'SlabHasil'), jml = $('#' + awalan + 'SlabJml');
  if(hasil) hasil.textContent = ringkasNomor(n) || '—';
  if(jml) jml.textContent = n.length ? n.length + ' slab' : 'belum dipilih';
}
/* Pasang perilaku kisi. simpan(teksRingkas) dipanggil tiap pilihan berubah. */
function pasangSlab(awalan, simpan){
  var kisi = $('#' + awalan + 'SlabKisi');
  if(!kisi) return;
  var seret = false, awal = null, dasar = {};
  function terpilih(){
    return Array.prototype.filter.call(kisi.children, function(b){ return b.classList.contains('pilih'); })
             .map(function(b){ return +b.dataset.n; });
  }
  function gambar(sampai){
    var a = Math.min(awal, sampai), b = Math.max(awal, sampai);
    Array.prototype.forEach.call(kisi.children, function(el){
      var v = +el.dataset.n;
      el.classList.toggle('pilih', !!dasar[v] || (v >= a && v <= b));
    });
    lapor();
  }
  function lapor(){
    var t = terpilih();
    $('#' + awalan + 'SlabHasil').textContent = ringkasNomor(t) || '—';
    $('#' + awalan + 'SlabJml').textContent = t.length ? t.length + ' slab' : 'belum dipilih';
    if(simpan) simpan(ringkasNomor(t));
  }
  kisi.addEventListener('pointerdown', function(e){
    var b = e.target.closest('button[data-n]'); if(!b) return;
    e.preventDefault();
    seret = true; awal = +b.dataset.n;
    dasar = {};
    if(e.ctrlKey || e.metaKey || e.shiftKey)
      terpilih().forEach(function(v){ dasar[v] = true; });
    gambar(awal);
    try{ kisi.setPointerCapture(e.pointerId); }catch(err){}
  });
  kisi.addEventListener('pointermove', function(e){
    if(!seret) return;
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var b = el && el.closest ? el.closest('button[data-n]') : null;
    if(b && kisi.contains(b)) gambar(+b.dataset.n);
  });
  var lepas = function(){ seret = false; };
  kisi.addEventListener('pointerup', lepas);
  kisi.addEventListener('pointercancel', lepas);
  window.addEventListener('pointerup', lepas);
  $('#' + awalan + 'SlabTerap').onclick = function(){
    var a = parseInt($('#' + awalan + 'SlabDari').value, 10);
    var b = parseInt($('#' + awalan + 'SlabSampai').value, 10);
    if(isNaN(a)) return;
    if(isNaN(b)) b = a;
    awal = a; dasar = {}; gambar(b);
  };
  $('#' + awalan + 'SlabKosong').onclick = function(){
    Array.prototype.forEach.call(kisi.children, function(el){ el.classList.remove('pilih'); });
    lapor();
  };
  $('#' + awalan + 'SlabLagi').onclick = function(){
    var mulai = kisi.children.length + 1;
    for(var i = mulai; i < mulai + 24; i++){
      var b = document.createElement('button');
      b.type = 'button'; b.dataset.n = i; b.textContent = i;
      kisi.appendChild(b);
    }
  };
}
/* ================= ISIAN TANGGAL YANG LEBIH MUDAH =================
   Boleh diketik "7 sep", "260907", "7/9", "hari ini" — atau pakai tombol
   cepat di bawahnya. */
function inputTanggal(id, nilai, cepat, atribut){
  var tampil = nilai ? tanggalIndo(nilai) : '';
  return '<div class="tgl-kotak"><input class="inp tgl-cerdas" id="' + id + '" ' + (atribut || '')
    + ' value="' + esc(tampil) + '" autocomplete="off" placeholder="7 sep · 260907 · 7/9 · hari ini"></div>'
    + '<div class="tgl-cepat">'
    + (cepat || []).map(function(o){
        return '<button type="button" data-tgl-set="' + esc(o.v) + '" data-tgl-untuk="' + id + '">'
          + esc(o.t) + '</button>'; }).join('')
    + '</div><span class="tgl-baca" data-tgl-baca="' + id + '"></span>';
}
function bacaTanggal(el){
  var iso = parseTanggalBebas(el.value, hariIni());
  var lap = document.querySelector('[data-tgl-baca="' + el.id + '"]');
  if(lap){
    lap.className = 'tgl-baca' + (el.value && !iso ? ' salah' : '');
    lap.textContent = !el.value ? '' : (iso ? tanggalIndo(iso) : 'tanggal belum terbaca — coba "7 sep" atau "260907"');
  }
  return iso;
}
document.addEventListener('input', function(e){
  if(e.target.classList && e.target.classList.contains('tgl-cerdas')) bacaTanggal(e.target);
});
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-tgl-set]');
  if(!b) return;
  e.preventDefault();
  var el = document.getElementById(b.dataset.tglUntuk);
  if(!el) return;
  el.value = tanggalIndo(b.dataset.tglSet);
  bacaTanggal(el);
  el.dispatchEvent(new Event('change', {bubbles:true}));
});

/* ============================ MODAL ============================ */
/* opsi.sisi = true -> tampil sebagai panel di SISI KANAN (sejajar dengan
   panel detail), bukan kotak melayang di tengah. */
function modal(judul, badan, tombol, opsi){
  $('#modal').classList.toggle('samping', !!(opsi && opsi.sisi));
  $('#modalJudul').textContent = judul;
  $('#modalBadan').innerHTML = badan;
  $('#modalKaki').innerHTML = '';
  (tombol||[]).forEach(function(t){
    var b = document.createElement('button');
    b.className = 'btn ' + (t.utama ? 'utama' : ''); b.textContent = t.label;
    b.onclick = t.klik; $('#modalKaki').appendChild(b);
  });
  $('#modal').classList.add('on');
}
function tutupModal(){ $('#modal').classList.remove('on'); $('#modal').classList.remove('samping'); }

      + '<button class="btn kecil bahaya" data-hapus-tim="'+esc(a.id)+'">✕</button></div>'; }).join('');
  modal('Pengaturan',
    (catatan ? '<div class="peringatan">'+esc(catatan)+'</div>' : '')
    + '<div class="fld"><label>Supabase — Project URL</label>'
    + '<input class="inp" id="sSbUrl" value="'+esc(cfg.sb_url||'')+'" placeholder="https://xxxxx.supabase.co"></div>'
    + '<div class="fld"><label>Supabase — kunci anon public</label>'
    + '<input class="inp" id="sSbKey" value="'+esc(cfg.sb_key||'')+'" placeholder="eyJhbGciOi..."></div>'
    + '<div class="info">Kalau dua kolom di atas diisi, aplikasi memakai Supabase: tim tinggal membuka halaman, '
    + 'tanpa login dan tanpa token. Perubahan muncul di layar orang lain dalam ±5 detik. '
    + 'Jalankan dulu <b>supabase/skema.sql</b> di SQL Editor, lalu tekan tombol di bawah untuk mengisi tabelnya.</div>'
    + '<div class="fld"><button class="btn" id="sSbIsi">Kirim semua data ke Supabase</button> '
    + '<button class="btn" id="sSbUji">Uji sambungan</button></div>'
    + '<div class="fld"><label>Token GitHub (cadangan, kalau tidak memakai Supabase)</label>'
    + '<input class="inp" id="sToken" type="password" value="'+esc(token)+'" placeholder="github_pat_…"></div>'
    + '<div class="info">Tanpa token kamu tetap bisa MELIHAT data (repo publik), tapi tidak bisa menyimpan. '
    + 'Buat token: GitHub → Settings → Developer settings → Personal access tokens → Fine-grained → pilih repo '
    + esc(cfg.owner)+'/'+esc(cfg.repo)+' → izin <b>Contents: Read and write</b>. Jangan pernah menaruh token di dalam berkas repo.</div>'
    + '<div class="duo"><div class="fld"><label>Owner</label><input class="inp" id="sOwner" value="'+esc(cfg.owner)+'"></div>'
    + '<div class="fld"><label>Repo</label><input class="inp" id="sRepo" value="'+esc(cfg.repo)+'"></div></div>'
    + '<div class="duo"><div class="fld"><label>Branch</label><input class="inp" id="sBranch" value="'+esc(cfg.branch)+'"></div>'
    + '<div class="fld"><label>Berkas data</label><input class="inp" id="sPath" value="'+esc(cfg.path)+'"></div></div>'
    + '<div class="info">Perubahan tersimpan sendiri, tidak ada tombol Simpan. Yang kamu ubah muncul di layar tim paling lama 15 detik kemudian.</div>'
    + '<div class="fld"><label>Anggota tim</label>'+tim
    + '<div style="display:flex;gap:7px"><input class="inp" id="sTimBaru" placeholder="nama baru"><button class="btn" id="sTambahTim">Tambah</button></div></div>'
    + '<div class="fld"><label>Batch</label><div style="display:flex;gap:7px"><input class="inp" id="sBatchBaru" placeholder="mis. Master Pending 17 Sep 2026"><button class="btn" id="sTambahBatch">Tambah</button></div></div>'
    + '<div class="fld"><label>Cadangan</label><div style="display:flex;gap:7px">'
    + '<button class="btn" id="sUnduh">Unduh JSON</button><button class="btn" id="sSalin">Salin JSON</button>'
    + '<button class="btn bahaya" id="sBenih">Pulihkan data awal</button></div>'
    + '<div class="samar2 mini" style="margin-top:5px">Pulihkan data awal membuang perubahan di browser ini dan memakai daftar bawaan aplikasi.</div></div>',
    [{label:'Tutup', klik:tutupModal},
     {label:'Simpan pengaturan', utama:true, klik:function(){
        token = $('#sToken').value.trim(); LS.taruh('mb_token', token);
        cfg.sb_url = $('#sSbUrl').value.trim().replace(/\/+$/, '');
        cfg.sb_key = $('#sSbKey').value.trim();
        cfg.owner=$('#sOwner').value.trim(); cfg.repo=$('#sRepo').value.trim();
        cfg.branch=$('#sBranch').value.trim()||'main'; cfg.path=$('#sPath').value.trim()||'data/db.json';
        LS.taruh('mb_cfg', cfg);
        document.querySelectorAll('[data-tim]').forEach(function(i){
          var a=(db.tim||[]).find(function(x){ return x.id===i.dataset.tim; });
          if(a && a.nama!==i.value.trim() && i.value.trim()){ a.nama=i.value.trim(); a.diperbarui=new Date().toISOString(); kotor=true; }
        });
        document.querySelectorAll('[data-rev]').forEach(function(i){
          var a=(db.tim||[]).find(function(x){ return x.id===i.dataset.rev; });
          if(a && !!a.reviewer !== i.checked){ a.reviewer=i.checked; a.diperbarui=new Date().toISOString(); kotor=true; }
        });
        if(kotor) tandaiKotor();
        tutupModal(); render(); capTerakhir = ''; mulaiPolling(); muatData(true);
     }}]);
  $('#sSbUji').onclick = async function(){
    var u = $('#sSbUrl').value.trim().replace(/\/+$/, ''), k = $('#sSbKey').value.trim();
    if(!u || !k){ pesan('Isi dulu URL dan kuncinya'); return; }
    var simpan = {sb_url:cfg.sb_url, sb_key:cfg.sb_key};
    cfg.sb_url = u; cfg.sb_key = k;
    try{
      var t = await sbAmbilTabel('projects');
      pesan('Sambungan OK — tabel projects berisi ' + t.length + ' baris', 4000);
    }catch(e){
      cfg.sb_url = simpan.sb_url; cfg.sb_key = simpan.sb_key;
      pesan('Gagal: ' + e.message + ' (sudah jalankan skema.sql?)', 7000);
    }
  };
  $('#sSbIsi').onclick = async function(){
    var u = $('#sSbUrl').value.trim().replace(/\/+$/, ''), k = $('#sSbKey').value.trim();
    if(!u || !k){ pesan('Isi dulu URL dan kuncinya'); return; }
    cfg.sb_url = u; cfg.sb_key = k; LS.taruh('mb_cfg', cfg);
    if(!confirm('Kirim ' + (db.projects||[]).length + ' project, ' + (db.tim||[]).length
      + ' orang, dan ' + (db.batches||[]).length + ' batch ke Supabase?')) return;
    try{
      var n = await isiAwalSupabase();
      pesan(n + ' project terkirim ke Supabase', 5000);
      tutupModal(); mulaiPolling(); muatData(true);
    }catch(e){ pesan('Gagal mengisi: ' + e.message, 7000); }
  };
  $('#sTambahTim').onclick = function(){
    var n = $('#sTimBaru').value.trim(); if(!n) return;
    db.tim.push({id:uid('t'), nama:n, warna:'', aktif:true, diperbarui:new Date().toISOString()});
    tandaiKotor(); bukaSetelan(); pesan(n + ' ditambahkan');
  };
  $('#sTambahBatch').onclick = function(){
    var n = $('#sBatchBaru').value.trim(); if(!n) return;
    db.batches.push({id:uid('b'), nama:n, tanggal:hariIni(), diperbarui:new Date().toISOString()});
    tandaiKotor(); bukaSetelan(); pesan('Batch ' + n + ' dibuat');
  };
  $('#sUnduh').onclick = function(){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db,null,1)], {type:'application/json'}));
    a.download = 'db-' + hariIni() + '.json'; a.click();
  };
  $('#sBenih').onclick = function(){
    if(!confirm('Buang data di browser ini dan kembali ke daftar bawaan aplikasi?')) return;
    var b = bacaBenih(); if(!b){ pesan('Data awal tidak ketemu'); return; }
    db = b; kotor = true; LS.taruh('mb_cache', db); tutupModal(); render(); pesan('Data awal dipulihkan — tekan Simpan bila mau dikirim ke GitHub');
  };
  $('#sSalin').onclick = function(){
    navigator.clipboard.writeText(JSON.stringify(db,null,1)).then(function(){ pesan('JSON disalin'); },
      function(){ pesan('Gagal menyalin'); });
  };
  document.querySelectorAll('[data-hapus-tim]').forEach(function(b){
    b.onclick = function(){
      db.tim = db.tim.filter(function(x){ return x.id !== b.dataset.hapusTim; });
      tandaiKotor(); bukaSetelan();
    };
  });
}

/* ============================ PERISTIWA ============================ */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-aksi]');
  if(t){ e.stopPropagation();
    var kode = t.dataset.aksi, id = t.dataset.id;
    if(!kode) return;
    if(kode === 'jawaban') dialogJawaban(id);
    else if(kode === 'revisi_baru') dialogRevisiBaru(id);
    else if(kode === 'kirim_sample') dialogKirim(id);
    else if(kode === 'tolak') dialogTolak(id);
    else if(kode === 'setuju'){
      var pp = pilihProject(id);
      modal('Review OK?', '<div class="info">'+esc(pp?pp.kode:'')+' akan ditandai <b>SELESAI</b> oleh '+esc(saya||'—')+'.</div>',
        [{label:'Batal', klik:tutupModal},
         {label:'Ya, selesai', utama:true, klik:function(){ jalankanAksi(id,'setuju'); tutupModal(); }}]);
    }
    else jalankanAksi(id, kode);
    return;
  }
  var brf = e.target.closest('[data-brief]');
  if(brf){ e.stopPropagation(); dialogBrief(brf.dataset.brief); return; }
  var amb = e.target.closest('[data-ambil]');
  if(amb){ ubahProject(amb.dataset.ambil, {pic:saya}, 'Assigned → ' + saya); pesan('Project ini di-assign ke kamu'); return; }
  var org = e.target.closest('[data-orang]');
  if(org){ e.preventDefault(); orangPilih = org.dataset.orang; LS.taruh('mb_orang', orangPilih);
    tampilan = 'orang'; LS.taruh('mb_tampilan', tampilan); render(); return; }
  var tj = e.target.closest('[data-terjemah]');
  if(tj){ e.stopPropagation(); dialogTerjemah(tj.dataset.terjemah, tj.dataset.brief); return; }
  var tt = e.target.closest('[data-tutup]');
  if(tt){
    var k = tt.dataset.tutup;
    tutupHari[k] = !tutupHari[k];
    LS.taruh('mb_tutup', tutupHari); render(); return;
  }
  var bk = e.target.closest('[data-buka]');
  if(bk){ e.preventDefault(); bukaLaci(bk.dataset.buka); return; }
});
document.addEventListener('change', function(e){
  var s = e.target.closest('[data-set]');
  if(!s) return;
  var id = s.dataset.id, k = s.dataset.set, v = s.value;
  if(s.classList && s.classList.contains('tgl-cerdas')){
    var iso = parseTanggalBebas(v, hariIni());
    if(!iso){ pesan('Tanggal belum terbaca — contoh: 7 sep, 260907, 7/9'); return; }
    v = iso;
  }
  var tambalan = {};
  if(k === 'jenis') tambalan.jenis = v.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  else tambalan[k] = v;
  var p = pilihProject(id);
  var catat = (k === 'pic') ? ('Assigned → ' + (v || 'kosong'))
            : (k === 'status') ? ('status → ' + ((STATUS[v]||{}).label || v))
            : (k === 'jalur') ? ('jalur → ' + (JALUR[v] || v)) : '';
  if(p && p[k] !== v) ubahProject(id, tambalan, catat);
});
$('#tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  var el = document.getElementById('s-' + b.dataset.v);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
});
document.addEventListener('change', function(e){
  var c = e.target.closest('[data-pilih]');
  if(c){ terpilih[c.dataset.pilih] = c.checked; perbaruiBar();
    var tr = c.closest('tr'); if(tr) tr.style.background = c.checked ? 'var(--ac2)' : ''; return; }
  var h = e.target.closest('[data-pilih-hari]');
  if(h){
    kelompokPerHari(terpakai()).forEach(function(g){
      if(g.tanggal !== h.dataset.pilihHari) return;
      g.items.forEach(function(p){ terpilih[p.id] = h.checked; });
    });
    render(); return;
  }
});
function aksiMassal(fn, pesanTeks){
  var ids = Object.keys(terpilih).filter(function(k){ return terpilih[k]; });
  if(!ids.length) return;
  ids.forEach(fn);
  terpilih = {}; tandaiKotor(); render(); pesan(ids.length + ' project ' + pesanTeks);
}
$('#barPic').addEventListener('change', function(){
  var n = $('#barPic').value; if(!n) return;
  aksiMassal(function(id){ ubahDiam(id, {pic:n}, 'Assigned → ' + n + ' (assign massal)'); }, 'di-assign ke ' + n);
  $('#barPic').value = '';
});
$('#barPri').addEventListener('change', function(){
  var v = $('#barPri').value; if(!v) return;
  aksiMassal(function(id){ ubahDiam(id, {prioritas:v}, 'prioritas → ' + v); }, 'jadi ' + v);
  $('#barPri').value = '';
});
$('#barUrgent').onclick = function(){
  aksiMassal(function(id){ var p = pilihProject(id); ubahDiam(id, {urgent:!p.urgent}, 'tanda urgent diubah'); }, 'diubah tanda urgentnya');
};
$('#barBatal').onclick = function(){ terpilih = {}; render(); };
['cari','fPic','fPri','fStatus','fSelesai','fUrgent','fSaya','fHari','fID'].forEach(function(id){
  $('#'+id).addEventListener('input', render);
  $('#'+id).addEventListener('change', render);
});
$('#pilihBatch').addEventListener('change', function(){ LS.taruh('mb_batch', $('#pilihBatch').value); render(); });
$('#pilihSaya').addEventListener('change', function(){ saya = $('#pilihSaya').value; LS.taruh('mb_saya', saya); render(); });

$('#btnMuat').onclick = function(){ capTerakhir = ''; muatData(false); };
$('#btnSetel').onclick = function(){ bukaSetelan(); };
$('#btnTambah').onclick = dialogTambah;
$('#btnTempel').onclick = dialogTempel;
$('#btnTutupLaci').onclick = tutupLaci;
$('#tirai').onclick = function(){ tutupLaci(); };
$('#btnHapus').onclick = function(){
  var p = pilihProject(laciId); if(!p) return;
  modal('Hapus project?', '<div class="peringatan">'+esc(p.kode)+' akan dihapus untuk semua orang. Tidak bisa dibatalkan.</div>',
    [{label:'Batal', klik:tutupModal},
     {label:'Hapus', klik:function(){
        if(pakaiSB()){
          // Supabase menolak DELETE (aturan RLS): ditandai saja supaya masih bisa dikembalikan
          p.dihapus = true; p.diperbarui = new Date().toISOString();
          db.projects = db.projects.filter(function(x){ return x.id !== p.id; });
          basis.projects = (basis.projects||[]).filter(function(x){ return x.id !== p.id; });
          db.projects.push(p);
        } else {
          db.projects = db.projects.filter(function(x){ return x.id !== p.id; });
        }
        tandaiKotor(); tutupModal(); tutupLaci(); render(); pesan(p.kode + ' dihapus'); }}]);
};
$('#btnTema').onclick = function(){
  var t = document.documentElement.dataset.tema === 'terang' ? 'gelap' : 'terang';
  document.documentElement.dataset.tema = t; LS.taruh('mb_tema', t);
};
$('#modal').addEventListener('click', function(e){ if(e.target === $('#modal')) tutupModal(); });
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ tutupModal(); tutupLaci(); }
  if((e.ctrlKey||e.metaKey) && e.key === 's'){ e.preventDefault(); simpanData(false); }
});
window.addEventListener('beforeunload', function(e){ if(kotor && !token){ e.preventDefault(); e.returnValue=''; } });

/* ============================ MULAI ============================ */
(function mulai(){
  document.documentElement.dataset.tema = LS.ambil('mb_tema','gelap');
  var cache = LS.ambil('mb_cache', null);
  if(cache && cache.projects && cache.projects.length){ db = cache; basis = JSON.parse(JSON.stringify(cache)); }
  else { db = bacaBenih() || db; basis = JSON.parse(JSON.stringify(db)); }
  render();
  setSink('lokal', pakaiSB() ? 'menyambung ke Supabase…'
    : (token ? 'menyambung ke GitHub…' : 'hanya lihat (belum diatur di ⚙)'));
  muatData(true).then(mulaiPolling);
  // Perubahan orang lain langsung tersusul begitu tab dibuka / komputer bangun
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) segarkanSekarang(); });
  window.addEventListener('focus', segarkanSekarang);
  window.addEventListener('online', segarkanSekarang);
})();
</script>
